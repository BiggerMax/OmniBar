<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- macOS squircle 路径（连续曲率圆角矩形）-->
    <clipPath id="squircle">
      <path d="M 512 0
               C 774 0 860 0 930 30
               C 982 50 974 42 994 94
               C 1024 164 1024 250 1024 512
               C 1024 774 1024 860 994 930
               C 974 982 982 974 930 994
               C 860 1024 774 1024 512 1024
               C 250 1024 164 1024 94 994
               C 42 974 50 982 30 930
               C 0 860 0 774 0 512
               C 0 250 0 164 30 94
               C 50 42 42 50 94 30
               C 164 0 250 0 512 0 Z"/>
    </clipPath>
    <!-- 主体渐变：靛蓝 → 深紫蓝，对齐 DT.Color.accent #7078F0 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B82F5"/>
      <stop offset="0.55" stop-color="#5A60D8"/>
      <stop offset="1" stop-color="#3D42B0"/>
    </linearGradient>
    <!-- 顶部高光渐变 -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 符号阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1B1E5C" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 背景 squircle -->
  <rect width="1024" height="1024" fill="url(#bg)" clip-path="url(#squircle)"/>
  <!-- 顶部光泽 -->
  <rect width="1024" height="1024" fill="url(#gloss)" clip-path="url(#squircle)"/>

  <!-- 中心路由/网关符号：三个节点 + 中心枢纽，表达「多 Provider 汇聚路由」 -->
  <g filter="url(#shadow)" transform="translate(512 500)">
    <!-- 外环（柔和轨道）-->
    <circle r="250" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="10"/>
    <!-- 连接线：三个上游节点 → 中心 -->
    <g stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="20" stroke-linecap="round">
      <line x1="0" y1="-250" x2="0" y2="-70"/>
      <line x1="216.5" y1="125" x2="60.6" y2="35"/>
      <line x1="-216.5" y1="125" x2="-60.6" y2="35"/>
    </g>
    <!-- 中心枢纽（路由核心）-->
    <circle r="78" fill="#FFFFFF"/>
    <circle r="78" fill="none" stroke="#5A60D8" stroke-width="6" stroke-opacity="0.3"/>
    <!-- 中心枢纽内的指示符：向下的数据流箭头 -->
    <path d="M -26 -22 L 26 -22 M 0 -22 L 0 26 M -16 12 L 0 28 L 16 12"
          fill="none" stroke="#5A60D8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 三个上游节点（Provider）-->
    <circle cx="0" cy="-250" r="46" fill="#FFFFFF"/>
    <circle cx="216.5" cy="125" r="46" fill="#FFFFFF"/>
    <circle cx="-216.5" cy="125" r="46" fill="#FFFFFF"/>
    <!-- 节点内的状态色点：绿/黄/绿，表达健康度 -->
    <circle cx="0" cy="-250" r="20" fill="#10B981"/>
    <circle cx="216.5" cy="125" r="20" fill="#F59E0B"/>
    <circle cx="-216.5" cy="125" r="20" fill="#10B981"/>
  </g>

  <!-- 右下角状态指示圆点（与菜单栏图标呼应：运行中=绿）-->
  <g clip-path="url(#squircle)">
    <circle cx="820" cy="820" r="62" fill="#0F111A" fill-opacity="0.35"/>
    <circle cx="820" cy="820" r="40" fill="#10B981"/>
    <circle cx="820" cy="820" r="40" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"/>
  </g>
</svg>
